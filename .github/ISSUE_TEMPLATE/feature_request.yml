name: Feature request
description: Suggest an improvement for Meeting Note
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this preserve local-first transcription?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
