name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: |
            .build
            .cache/swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
      - name: Test
        run: make test
      - name: Build distributables
        run: make build
      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranscribe-macOS-arm64
          path: |
            dist/LocalTranscribe-macOS-arm64.zip
            dist/LocalTranscribe-macOS-arm64.dmg
